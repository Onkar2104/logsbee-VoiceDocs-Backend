name: Document formatting tests

on:
  push:
    branches:
      - feature/ai-document-formatting
  pull_request:
    branches:
      - feature/ai-document-formatting

jobs:
  formatting-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi pydantic-settings httpx pytest
      - name: Run document formatting tests
        run: pytest -q tests/test_document_formatting_service.py
